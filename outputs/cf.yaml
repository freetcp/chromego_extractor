proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - ws优选1
      - ws优选2
      - ws优选3
      - ws优选4
      - ws优选5
      - ws优选6
      - tcp优选1
      - tcp优选2
      - tcp优选3
      - tcp优选4
      - tcp优选5
      - tcp优选6
  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - ws优选1
      - ws优选2
      - ws优选3
      - ws优选4
      - ws优选5
      - ws优选6
      - tcp优选1
      - tcp优选2
      - tcp优选3
      - tcp优选4
      - tcp优选5
      - tcp优选6
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择
      - ws优选1
      - ws优选2
      - ws优选3
      - ws优选4
      - ws优选5
      - ws优选6
      - tcp优选1
      - tcp优选2
      - tcp优选3
      - tcp优选4
      - tcp优选5
      - tcp优选6
