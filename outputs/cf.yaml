proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - CF官方优选1
      - CF官方优选2
      - CF官方优选3
      - CF官方优选4
      - CF官方优选5
      - CF官方优选6
  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - CF官方优选1
      - CF官方优选2
      - CF官方优选3
      - CF官方优选4
      - CF官方优选5
      - CF官方优选6
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择
      - CF官方优选1
      - CF官方优选2
      - CF官方优选3
      - CF官方优选4
      - CF官方优选5
      - CF官方优选6
