mixed-port: 7890
tproxy-port: 7893
bind-address: '*'
mode: rule
log-level: silent
find-process-mode: strict
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
secret: ''
external-ui: ui
external-ui-url: https://v6.gh-proxy.org/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages-no-fonts.zip
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  force-dns-mapping: true
  parse-extra-domain: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.home.arpa
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*
  - +.pool.ntp.org
  - stun.*.*
  - +.n.n.srv.nintendo.net
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    geosite:cn:
    - 223.5.5.5
    - 119.29.29.29
    geosite:category-ads-all: rcode://name_error
